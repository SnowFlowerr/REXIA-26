<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" fill="none">
  <!-- Starburst -->
  <g transform="translate(70, 70)">
    <!-- Main 8-point star burst -->
    <polygon points="0,-65 8,-18 0,-25 -8,-18" fill="currentColor" opacity="0.95"/>
    <polygon points="0,65 8,18 0,25 -8,18" fill="currentColor" opacity="0.95"/>
    <polygon points="-65,0 -18,8 -25,0 -18,-8" fill="currentColor" opacity="0.95"/>
    <polygon points="65,0 18,8 25,0 18,-8" fill="currentColor" opacity="0.95"/>
    <!-- Diagonal spikes -->
    <polygon points="-46,-46 -10,-16 -16,-10" fill="currentColor" opacity="0.85"/>
    <polygon points="46,46 10,16 16,10" fill="currentColor" opacity="0.85"/>
    <polygon points="46,-46 16,-10 10,-16" fill="currentColor" opacity="0.85"/>
    <polygon points="-46,46 -16,10 -10,16" fill="currentColor" opacity="0.85"/>
    <!-- Longer primary spikes -->
    <polygon points="0,-70 4,-8 -4,-8" fill="currentColor"/>
    <polygon points="0,70 4,8 -4,8" fill="currentColor"/>
    <polygon points="-70,0 -8,4 -8,-4" fill="currentColor"/>
    <polygon points="70,0 8,4 8,-4" fill="currentColor"/>
    <!-- Accent diagonals (thinner, longer) -->
    <polygon points="-52,-52 -6,-12 -12,-6" fill="currentColor" opacity="0.7"/>
    <polygon points="52,52 6,12 12,6" fill="currentColor" opacity="0.7"/>
    <polygon points="52,-52 12,-6 6,-12" fill="currentColor" opacity="0.7"/>
    <polygon points="-52,52 -12,6 -6,12" fill="currentColor" opacity="0.7"/>
    <!-- Center glow circle -->
    <circle cx="0" cy="0" r="6" fill="currentColor" opacity="0.5"/>
  </g>
  <!-- "rexia" text -->
  <text x="148" y="95" font-family="Manrope, sans-serif" font-size="72" font-weight="700" fill="currentColor" letter-spacing="2">rexia</text>
</svg>
